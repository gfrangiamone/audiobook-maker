name: Deploy to Production

on:
  push:
    branches: [main]

# Un deploy alla volta: due push ravvicinati non si sovrappongono sul server.
concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  # Gate (O2, 2026-10-13): prima non c'era nulla, nemmeno il py_compile che
  # deploy-test.yml aveva. Se qui qualcosa non passa, il job `deploy` non parte.
  check:
    runs-on: ubuntu-latest
    env:
      ABM_BASE_URL: http://localhost:5601
      ABM_ADMIN_TOKEN: ci-admin-token
      # Senza, l'import della app prova il default /var/lib/audiobook-maker,
      # non scrivibile sul runner: 128 errori di collection al primo run.
      ABM_DATA_DIR: /tmp/abm-data   # `runner.temp` non e' disponibile nell'env di job
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803  # v6.1.0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1  # v6.3.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-ci.txt
      - name: Python syntax check (py_compile su tutti i .py tracciati)
        run: python -m py_compile $(git ls-files '*.py')
      - name: ffmpeg (i test di assembly e dei chunk lo usano)
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - name: Dipendenze (senza lo stack torch, vedi requirements-ci.txt)
        run: pip install -r requirements-ci.txt
      - name: pytest
        run: python -m pytest test/ -q --tb=short -p no:cacheprovider

  deploy:
    runs-on: ubuntu-latest
    needs: check
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: root
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            set -e
            cd /opt/audiobook-maker
            PREV=$(git rev-parse HEAD)
            git fetch origin main
            git reset --hard origin/main
            pip install -r requirements.txt --break-system-packages 2>/dev/null || pip install -r requirements.txt
            systemctl daemon-reload 2>/dev/null || true
            systemctl restart audiobook-maker
            # Health check: /healthz risponde 200 solo con app su e cartella dati
            # scrivibile. Fino a 60 s di attesa, poi rollback al commit precedente.
            for i in $(seq 1 30); do
              sleep 2
              if curl -fsS http://127.0.0.1:5601/healthz >/dev/null 2>&1; then
                echo "Deploy completato: $(git rev-parse --short HEAD) $(date)"
                exit 0
              fi
            done
            echo "healthz non risponde: rollback a $PREV"
            git reset --hard "$PREV"
            pip install -r requirements.txt --break-system-packages 2>/dev/null || pip install -r requirements.txt
            systemctl restart audiobook-maker
            exit 1
